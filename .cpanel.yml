deployment:
tasks: 

### 1. Prepare and deploy Frontend Standalone Server files

* /bin/mkdir -p /home/appointn/booking-front
* /bin/rsync -av --delete ./booking/dist-front/standalone/ /home/appointn/booking-front/

### 2. Deploy Frontend Public & Static assets directly to the web root

* /bin/mkdir -p /home/appointn/public_html/dist-front
* /bin/rsync -av ./booking/dist-front/static/ /home/appointn/public_html/dist-front/static/
* /bin/rsync -av ./booking/public/ /home/appointn/public_html/public/

### 3. Deploy the Backend (booking-back)

* /bin/mkdir -p /home/appointn/booking-back
* /bin/rsync -av --delete --exclude='node_modules/' --exclude='.env' ./booking-back/ /home/appointn/booking-back

### 4. Restart the Frontend Node.js Application

* /bin/mkdir -p /home/appointn/booking-front/tmp
* /bin/touch /home/appointn/booking-front/tmp/restart.txt

### 5. Restart the Backend Node.js Application

* /bin/mkdir -p /home/appointn/booking-back/tmp
* /bin/touch /home/appointn/booking-back/tmp/restart.txt